name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          # Base URL of the recipe API Worker (the /upload OAuth backend). Set this once in
          # repo Settings → Secrets and variables → Actions → Variables as PUBLIC_RECIPE_API,
          # e.g. https://izzy-recipe-api.<subdomain>.workers.dev
          PUBLIC_RECIPE_API: ${{ vars.PUBLIC_RECIPE_API }}
          # Base URL of the Pi order server (via Cloudflare Tunnel), backing /order and /orders.
          # Set once in repo Settings → Secrets and variables → Actions → Variables as
          # PUBLIC_ORDER_API, e.g. https://orders.izzybennett.com
          PUBLIC_ORDER_API: ${{ vars.PUBLIC_ORDER_API }}
      # /izzys-cafe.json is a published contract, not an internal detail: the dizzyos LED sign in
      # the kitchen fetches it by hardcoded URL and renders a stale fallback menu rather than going
      # blank when it breaks. Validate the real artifact before anything is published.
      - run: npm run check:menu-feed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
